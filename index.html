            <div class="col-6 align-self-center text-right">
                <button class="btn btn-sm net-pri-btn" id="showMovieBtn">Add Movie</button>

        </div>

    <div class="backDrop" id="backDrop"></div>
    <div class="movieModal" id="movieModal">
        <form id="movieForm">
            <div class="card bg-info">
                <div class="card-header d-flex justify-content-between">
                    <h4>Add Movie</h4>
                    <i role="button" class="fa-solid fa-xmark fa-2x" id="closeIcon"></i>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="movieTitle">Movie Title</label>
                                <input type="text" id="movieTitle" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="movieImg">Movie Image</label>
                                <input type="text" id="movieImg" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="createdAt">Created At</label>
                                <input type="datetime-local" class="form-control" id="createdAt">
                            </div>

                            <div class="form-group">
                                <label for="updatedAt">Updated At</label>
                                <input type="datetime-local" class="form-control" id="updatedAt">
                            </div>

                            <div class="form-group">
                                <label for="movieDescription">Movie Description</label>
                                <textarea id="movieDescription" class="form-control mr-3"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="movieRating">Movie Rating</label>
                                <select name="" id="movieRating" class="form-control">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="date">Date</label>
                                <input type="date" id="date" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="genre">Genre</label>
                                <input type="text" id="genre" class="form-control">
                            </div>

                        </div>
                    </div>
                </div>

                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" id="submitMovieBtn" class="btn btn-sm net-sec-btn">Add Movie</button>
                    <button type="button" id="updateMovieBtn" class="btn btn-sm net-sec-btn d-none">Update
                        Movie</button>
                    <button type="button" id="closeBtn" class="btn btn-sm net-pri-btn">Close</button>

                </div>
            </div>
        </form>
    </div>
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
